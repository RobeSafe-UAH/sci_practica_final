site_name: Práctica final de SCI
site_description: Guía de instalación y uso del simulador SCI.
site_url: https://robesafe-uah.github.io/sci_practica_final/
repo_url: https://github.com/RobeSafe-UAH/sci_practica_final
repo_name: RobeSafe-UAH/sci_practica_final
edit_uri: edit/main/docs/pages/
docs_dir: pages
site_dir: site
theme:
  name: material
  language: es
  font: false
  palette:
    primary: indigo
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - content.tabs.link
    - content.code.copy
nav:
  - Instalación: index.md
  - Ejecución: ejecucion.md
  - ROS2: topics.md
  - Repositorio: repositorio.md
extra_css:
  - assets/styles.css
markdown_extensions:
  - admonition
  - tables
  - md_in_html
  - sane_lists
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
plugins:
  - search:
      lang: es
validation:
  links:
    absolute_links: warn
    unrecognized_links: warn
