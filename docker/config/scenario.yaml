# Metres, seconds, radians unless a key explicitly ends in _deg.
simulation:
  rate_hz: 20.0  # Physics, sensors and ROS publications.
track:
  # Four straights joined by circular curves, two lanes in opposite directions.
  name: circuito_sci
  shape: rounded_rectangle
  length: 40.0
  height: 26.0
  corner_radius: 8.0
  width: 1.5  # Two lanes, 0.75 m each.
  direction: ccw
  wall_thickness: 0.12
  resolution: 0.02
robot:
  name: r0
  wheelbase: 0.3302
  spawn_s: 0.0
  max_speed: 13.88888888888889  # 50 km/h, expressed in m/s; forward only.
  max_steer_deg: 45.0
traffic:
  count: 2  # Integer from 0 to 6; initial positions are calculated automatically.
  speed: 1
  start_distance: 5.0
  spacing: 12.0
lidar:
  x: 0.27
  y: 0.0
  z: 0.15
  fov_degrees: 270.0
  nrays: 1081
  max_range: 30.0
sonar:
  # Equal-width sectors covering the Hokuyo scan, from right to left.
  # All virtual cones inherit its origin, measurement limits and timestamps.
  count: 8
