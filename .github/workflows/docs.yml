name: Documentación

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - .github/workflows/docs.yml
      - Makefile
      - docker/.env
      - docker/compose.yaml
      - tests/**
  pull_request:
    paths:
      - docs/**
      - .github/workflows/docs.yml
      - Makefile
      - docker/.env
      - docker/compose.yaml
      - tests/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Comprobar documentación
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - name: Instalar herramientas
        run: python -m pip install -r docs/requirements.txt
      - name: Comprobar dominio ROS2
        run: |
          docker compose version
          python -m unittest discover -s tests -v
      - name: Construir sitio
        run: python -m mkdocs build --strict --config-file docs/mkdocs.yml
      - name: Comprobar páginas para alumnos
        run: |
          test -f docs/site/matlab/index.html
          test ! -e docs/site/repositorio
          test ! -e docs/site/repositorio.md
      - name: Preparar GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6
      - name: Guardar sitio
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/site

  deploy:
    name: Publicar documentación
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
